<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html new syntax</title>
</head>
<body>
    <h1>Signup Page</h1>
    <h3>Please Note: First Name, Last Name, Password and Email Address are required</h3>

    <label for="firstname">First Name:</label>
    <input type="text" id="firstname" placeholder="Enter first name" required>

    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname" placeholder="Enter last name" required><br> <br>

    <label for="email">Email:</label>
    <input for="email" id="email" placeholder="Enter Email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password" required>
<br>
    <p>Are you above the age of 18?</p>
    <label for="yes">Yes</label>
    <input type="radio" id="yes" name="yes">

    <label for="no">No</label>
    <input type="radio" name="yes" id="no">

    <p>Do you have a credit card or paypal?</p>
    <select>
        <option value="credit">credit card</option>
        <option value="pal">paypal</option>
        <option value="no">I dont have any of them</option>
    </select> <br><br>

    <input type="button" value="Send">

</body>
</html>
</body>
</html>
