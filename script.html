<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login + Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  
  body {
    background: linear-gradient(135deg, #041d8b 0%, #4e8ae4 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    width: 380px;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }

  h2 { margin-bottom: 20px; color: #333; text-align: center; }
  
  .input-group { position: relative; margin: 15px 0; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
  }
  input:focus { border-color: #667eea; outline: none; }

  .toggle-pass {
    position: absolute;
    right: 12px;
    top: 14px;
    cursor: pointer;
    color: #667eea;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .error { color: #ff4757; font-size: 14px; margin-top: 10px; display: none; }
  .success { color: #2ed573; font-size: 14px; margin-top: 10px; display: none; }

  .dashboard { display: none; width: 600px; }
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin: 20px 0;
  }
  .stat-box {
    background: #f8f9ff;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
  }
  .stat-box h3 { color: #667eea; font-size: 24px; }
  .logout-btn { background: #ff4757; width: auto; padding: 10px 20px; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="card" id="loginPage">
  <h2>Welcome Back 👋</h2>
  <div class="input-group">
    <input type="text" id="username" placeholder="Enter Username">
  </div>
  <div class="input-group">
    <input type="password" id="password" placeholder="Enter Password">
    <span class="toggle-pass" onclick="togglePassword()">Show</span>
  </div>
  <button id="loginBtn" onclick="login()">Login</button>
  <p class="error" id="errorMsg"></p>
  <p class="success" id="successMsg"></p>
  <p style="margin-top:15px; font-size:12px; color:#666; text-align:center;">Demo: <b>admin</b> / <b>1234</b></p>
</div>

<!-- DASHBOARD PAGE -->
<div class="card dashboard" id="dashboardPage">
  <div class="dashboard-header">
    <h2 id="welcomeText">Dashboard</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  
  <p>Welcome to your dashboard! Here’s your overview:</p>
  
  <div class="stats">
    <div class="stat-box">
      <h3>127</h3>
      <p>Users</p>
    </div>
    <div class="stat-box">
      <h3>₦450K</h3>
      <p>Revenue</p>
    </div>
    <div class="stat-box">
      <h3>89%</h3>
      <p>Growth</p>
    </div>
  </div>
  
  <button onclick="alert('Feature coming soon!')">View Reports</button>
</div>

<script>
const DEMO_USER = "admin";
const DEMO_PASS = "1234";

function togglePassword() {
  let pass = document.getElementById("password");
  let toggle = document.querySelector(".toggle-pass");
  if (pass.type === "password") {
    pass.type = "text";
    toggle.innerText = "Hide";
  } else {
    pass.type = "password";
    toggle.innerText = "Show";
  }
}

function login() {
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;
  let errorMsg = document.getElementById("errorMsg");
  let successMsg = document.getElementById("successMsg");
  let btn = document.getElementById("loginBtn");

  errorMsg.style.display = "none";
  successMsg.style.display = "none";

  if (username === "" || password === "") {
    errorMsg.innerText = "Please fill in all fields!";
    errorMsg.style.display = "block";
    return;
  }

  // Loading state
  btn.innerText = "Logging in...";
  btn.disabled = true;

  setTimeout(() => {
    if (username === DEMO_USER && password === DEMO_PASS) {
      successMsg.innerText = "Login Successful! Redirecting...";
      successMsg.style.display = "block";
      localStorage.setItem("loggedInUser", username);
      setTimeout(showDashboard, 1000);
    } else {
      errorMsg.innerText = "Invalid username or password!";
      errorMsg.style.display = "block";
      btn.innerText = "Login";
      btn.disabled = false;
    }
  }, 800);
}

function showDashboard() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("dashboardPage").style.display = "block";
  let user = localStorage.getItem("loggedInUser");
  document.getElementById("welcomeText").innerText = "Welcome, " + user + "! 🎉";
}

function logout() {
  localStorage.removeItem("loggedInUser");
  document.getElementById("dashboardPage").style.display = "none";
  document.getElementById("loginPage").style.display = "block";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("loginBtn").innerText = "Login";
  document.getElementById("loginBtn").disabled = false;
}

window.onload = function() {
  if (localStorage.getItem("loggedInUser")) {
    showDashboard();
  }
}
</script>
</body>
</html>
